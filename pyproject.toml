[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "botfarm"
version = "0.1.0"
description = "Bitcoin-only scalp trading bot research framework (backtest + paper trading, Bitget public data)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
