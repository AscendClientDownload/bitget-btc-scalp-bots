id: sz_005_zscore_volume_confirm
name: Z-Score + Volume Confirmation
category: statistical_zscore
timeframe: 5min
indicators:
- name: zscore
  alias: z
  params:
    period: 20
- name: volume_sma_ratio
  alias: vol_ratio
  params:
    period: 20
entry:
  side: long
  rule: z <= -2.0 and vol_ratio > 1.3
exit:
  rule: z >= 0
atr_period: 14
stop_loss_atr_mult: 1.5
take_profit_atr_mult: 2.5
max_holding_bars: 24
notes: Statistical deviation entry that also requires a volume spike.
