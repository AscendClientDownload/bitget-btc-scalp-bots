id: sz_006_zscore_rsi_combo
name: Z-Score + RSI Combo
category: statistical_zscore
timeframe: 5min
indicators:
- name: zscore
  alias: z
  params:
    period: 20
- name: rsi
  alias: rsi_14
  params:
    period: 14
entry:
  side: long
  rule: z <= -1.5 and rsi_14 <= 35
exit:
  rule: z >= 0 or rsi_14 >= 55
atr_period: 14
stop_loss_atr_mult: 1.4
take_profit_atr_mult: 2.4
max_holding_bars: 24
notes: Statistical deviation confirmed by a classical momentum oscillator.
