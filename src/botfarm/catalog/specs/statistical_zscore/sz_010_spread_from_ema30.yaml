id: sz_010_spread_from_ema30
name: Percent Spread from EMA30
category: statistical_zscore
timeframe: 5min
indicators:
- name: ema
  alias: ema30
  params:
    period: 30
entry:
  side: long
  rule: (close - ema30) / ema30 <= -0.015
exit:
  rule: close >= ema30
atr_period: 14
stop_loss_atr_mult: 1.4
take_profit_atr_mult: 2.3
max_holding_bars: 24
notes: Percentage-spread mean reversion using an EMA instead of an SMA as the reference
  level.
