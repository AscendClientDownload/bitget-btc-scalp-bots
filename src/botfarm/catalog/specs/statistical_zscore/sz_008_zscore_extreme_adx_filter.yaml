id: sz_008_zscore_extreme_adx_filter
name: Extreme Z-Score + Non-Trending Filter
category: statistical_zscore
timeframe: 5min
indicators:
- name: zscore
  alias: z
  params:
    period: 20
- name: adx
  alias: adx
  params:
    period: 14
entry:
  side: long
  rule: z <= -2.5 and adx <= 20
exit:
  rule: z >= 0
atr_period: 14
stop_loss_atr_mult: 1.6
take_profit_atr_mult: 2.8
max_holding_bars: 24
notes: A very extreme deviation combined with a regime filter to avoid fading an established
  trend.
