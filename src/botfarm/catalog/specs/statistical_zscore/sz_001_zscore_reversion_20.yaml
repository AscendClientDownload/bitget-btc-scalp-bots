id: sz_001_zscore_reversion_20
name: Z-Score Reversion (20-bar)
category: statistical_zscore
timeframe: 5min
indicators:
- name: zscore
  alias: z
  params:
    period: 20
entry:
  side: long
  rule: z <= -2.0
exit:
  rule: z >= 0
atr_period: 14
stop_loss_atr_mult: 1.5
take_profit_atr_mult: 2.5
max_holding_bars: 24
notes: 'Baseline statistical mean-reversion entry: 2 standard deviations below the
  20-bar mean.'
