id: sz_004_percent_b_low
name: '%B Extreme Low'
category: statistical_zscore
timeframe: 5min
indicators:
- name: percent_b
  alias: pct_b
  params:
    period: 20
    num_std: 2.0
entry:
  side: long
  rule: pct_b <= 0.02
exit:
  rule: pct_b >= 0.5
atr_period: 14
stop_loss_atr_mult: 1.5
take_profit_atr_mult: 2.5
max_holding_bars: 24
notes: '%B expressed as a near-zero extreme rather than a raw band-touch comparison.'
