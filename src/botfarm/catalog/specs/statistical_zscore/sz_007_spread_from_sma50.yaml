id: sz_007_spread_from_sma50
name: Percent Spread from SMA50
category: statistical_zscore
timeframe: 5min
indicators:
- name: sma
  alias: sma50
  params:
    period: 50
entry:
  side: long
  rule: (close - sma50) / sma50 <= -0.02
exit:
  rule: close >= sma50
atr_period: 14
stop_loss_atr_mult: 1.4
take_profit_atr_mult: 2.3
max_holding_bars: 24
notes: Mean reversion via a raw percentage spread from a 50-bar SMA rather than a
  z-score.
