id: sz_002_zscore_reversion_10
name: Z-Score Reversion (10-bar, reactive)
category: statistical_zscore
timeframe: 5min
indicators:
- name: zscore
  alias: z
  params:
    period: 10
entry:
  side: long
  rule: z <= -1.8
exit:
  rule: z >= 0.2
atr_period: 14
stop_loss_atr_mult: 1.3
take_profit_atr_mult: 2.2
max_holding_bars: 24
notes: Shorter lookback for a more reactive, higher-frequency statistical entry.
