id: sz_011_zscore_overshoot_exit
name: Z-Score Reversion, Overshoot Exit
category: statistical_zscore
timeframe: 5min
indicators:
- name: zscore
  alias: z
  params:
    period: 14
entry:
  side: long
  rule: z <= -1.6
exit:
  rule: z >= 0.5
atr_period: 14
stop_loss_atr_mult: 1.3
take_profit_atr_mult: 2.2
max_holding_bars: 24
notes: Shorter-window z-score entry that holds until price overshoots back past the
  mean, not just reaches it.
