id: sz_003_zscore_reversion_30
name: Z-Score Reversion (30-bar, strict)
category: statistical_zscore
timeframe: 5min
indicators:
- name: zscore
  alias: z
  params:
    period: 30
entry:
  side: long
  rule: z <= -2.2
exit:
  rule: z >= -0.2
atr_period: 14
stop_loss_atr_mult: 1.6
take_profit_atr_mult: 2.8
max_holding_bars: 24
notes: Longer lookback and a stricter threshold for rarer, higher-conviction deviations.
