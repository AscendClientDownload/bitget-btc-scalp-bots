id: sz_009_percent_b_zscore_combo
name: '%B + Z-Score Confluence'
category: statistical_zscore
timeframe: 5min
indicators:
- name: percent_b
  alias: pct_b
  params:
    period: 20
    num_std: 2.0
- name: zscore
  alias: z
  params:
    period: 20
entry:
  side: long
  rule: pct_b <= 0.05 and z <= -1.8
exit:
  rule: pct_b >= 0.5
atr_period: 14
stop_loss_atr_mult: 1.5
take_profit_atr_mult: 2.5
max_holding_bars: 24
notes: Two independent statistical measures of the same deviation must agree.
