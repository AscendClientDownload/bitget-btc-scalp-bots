id: vo_004_obv_rsi_combo
name: OBV Trend + RSI Combo
category: volume_orderflow
timeframe: 5min
indicators:
- name: obv
  alias: obv
  params: {}
- name: sma
  alias: obv_sma
  params:
    period: 10
    source: obv
- name: rsi
  alias: rsi_14
  params:
    period: 14
entry:
  side: long
  rule: obv > obv_sma and rsi_14 > 50
exit:
  rule: rsi_14 < 45
atr_period: 14
stop_loss_atr_mult: 1.3
take_profit_atr_mult: 2.0
max_holding_bars: 24
notes: OBV above its short-term average, confirmed by RSI momentum.
