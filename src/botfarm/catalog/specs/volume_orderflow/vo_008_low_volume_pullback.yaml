id: vo_008_low_volume_pullback
name: Low-Volume Pullback in Uptrend
category: volume_orderflow
timeframe: 5min
indicators:
- name: ema
  alias: ema_trend
  params:
    period: 20
- name: volume_sma_ratio
  alias: vol_ratio
  params:
    period: 20
- name: rsi
  alias: rsi_14
  params:
    period: 14
entry:
  side: long
  rule: close > ema_trend and vol_ratio < 0.8 and rsi_14 >= 40 and rsi_14 <= 55
exit:
  rule: close < ema_trend
atr_period: 14
stop_loss_atr_mult: 1.3
take_profit_atr_mult: 2.0
max_holding_bars: 24
notes: A quiet, low-volume pullback within an established uptrend -- a continuation
  entry, not a breakout.
