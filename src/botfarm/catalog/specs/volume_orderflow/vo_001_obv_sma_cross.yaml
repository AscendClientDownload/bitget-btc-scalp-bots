id: vo_001_obv_sma_cross
name: OBV Crosses Above its SMA
category: volume_orderflow
timeframe: 5min
indicators:
- name: obv
  alias: obv
  params: {}
- name: sma
  alias: obv_sma
  params:
    period: 20
    source: obv
- name: cross_above
  alias: obv_cross_up
  params:
    a: obv
    b: obv_sma
entry:
  side: long
  rule: obv_cross_up
exit:
  rule: 'False'
atr_period: 14
stop_loss_atr_mult: 1.4
take_profit_atr_mult: 2.2
max_holding_bars: 24
notes: On-Balance Volume crossing above its own 20-bar moving average -- a volume-trend
  turn.
