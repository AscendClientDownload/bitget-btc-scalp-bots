id: vo_011_accumulation_obv_slope
name: Steady Accumulation (OBV + Volume)
category: volume_orderflow
timeframe: 5min
indicators:
- name: obv
  alias: obv
  params: {}
- name: sma
  alias: obv_sma
  params:
    period: 30
    source: obv
- name: volume_sma_ratio
  alias: vol_ratio
  params:
    period: 20
entry:
  side: long
  rule: obv > obv_sma and vol_ratio > 1.1
exit:
  rule: obv < obv_sma
atr_period: 14
stop_loss_atr_mult: 1.4
take_profit_atr_mult: 2.2
max_holding_bars: 24
notes: OBV above its longer average with modestly elevated volume -- steady accumulation
  rather than a spike.
