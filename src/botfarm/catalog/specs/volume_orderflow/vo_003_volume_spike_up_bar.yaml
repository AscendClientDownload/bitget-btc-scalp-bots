id: vo_003_volume_spike_up_bar
name: Volume Spike on an Up Bar
category: volume_orderflow
timeframe: 5min
indicators:
- name: volume_sma_ratio
  alias: vol_ratio
  params:
    period: 20
entry:
  side: long
  rule: vol_ratio > 2.0 and close > open
exit:
  rule: 'False'
atr_period: 14
stop_loss_atr_mult: 1.5
take_profit_atr_mult: 2.5
max_holding_bars: 24
notes: A bar with 2x average volume that also closes higher than it opened.
