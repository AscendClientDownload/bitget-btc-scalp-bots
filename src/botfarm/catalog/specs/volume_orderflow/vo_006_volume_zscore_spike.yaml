id: vo_006_volume_zscore_spike
name: Volume Z-Score Spike
category: volume_orderflow
timeframe: 5min
indicators:
- name: volume_zscore
  alias: vol_z
  params:
    period: 20
entry:
  side: long
  rule: vol_z > 2.0 and close > open
exit:
  rule: 'False'
atr_period: 14
stop_loss_atr_mult: 1.5
take_profit_atr_mult: 2.5
max_holding_bars: 24
notes: Statistically extreme volume (z-score > 2) on an up bar.
