id: vo_005_vwap_dip_volume
name: VWAP Dip on Heavy Volume
category: volume_orderflow
timeframe: 5min
indicators:
- name: rolling_vwap
  alias: vwap
  params:
    period: 20
- name: volume_sma_ratio
  alias: vol_ratio
  params:
    period: 20
entry:
  side: long
  rule: close < vwap * 0.995 and vol_ratio > 1.3
exit:
  rule: close > vwap
atr_period: 14
stop_loss_atr_mult: 1.4
take_profit_atr_mult: 2.2
max_holding_bars: 24
notes: Price dipping below VWAP on above-average volume -- a volume-driven dip-buy.
