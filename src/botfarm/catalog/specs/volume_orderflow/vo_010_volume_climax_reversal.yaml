id: vo_010_volume_climax_reversal
name: Volume Climax Reversal
category: volume_orderflow
timeframe: 5min
indicators:
- name: volume_zscore
  alias: vol_z
  params:
    period: 20
- name: rolling_vwap
  alias: vwap
  params:
    period: 20
entry:
  side: long
  rule: vol_z > 2.5 and close < open and close < vwap
exit:
  rule: close > vwap
atr_period: 14
stop_loss_atr_mult: 1.6
take_profit_atr_mult: 2.5
max_holding_bars: 24
notes: 'Contrarian entry: an extreme-volume down bar below VWAP, betting on capitulation
  exhaustion.'
