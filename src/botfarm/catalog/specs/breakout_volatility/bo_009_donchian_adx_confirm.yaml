id: bo_009_donchian_adx_confirm
name: Donchian 20 + ADX Confirmation
category: breakout_volatility
timeframe: 5min
indicators:
- name: donchian_channels
  alias: dc
  params:
    period: 20
- name: adx
  alias: adx
  params:
    period: 14
entry:
  side: long
  rule: close > donchian_upper and adx >= 20
exit:
  rule: 'False'
atr_period: 14
stop_loss_atr_mult: 1.5
take_profit_atr_mult: 3.0
max_holding_bars: 24
notes: Channel breakout that also requires ADX>=20, avoiding breakouts in a directionless
  market.
