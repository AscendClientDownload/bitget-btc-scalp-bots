id: bo_004_keltner_breakout
name: Keltner Channel Breakout
category: breakout_volatility
timeframe: 5min
indicators:
- name: keltner_channels
  alias: kc
  params:
    ema_period: 20
    atr_period: 10
    atr_mult: 2.0
entry:
  side: long
  rule: close > kc_upper
exit:
  rule: close < kc_middle
atr_period: 14
stop_loss_atr_mult: 1.5
take_profit_atr_mult: 2.5
max_holding_bars: 24
notes: Volatility-normalized (ATR-based) channel breakout instead of a raw price channel.
