id: bo_008_keltner_wide_breakout
name: Wide Keltner Breakout (2.5x ATR)
category: breakout_volatility
timeframe: 5min
indicators:
- name: keltner_channels
  alias: kc
  params:
    ema_period: 20
    atr_period: 10
    atr_mult: 2.5
entry:
  side: long
  rule: close > kc_upper
exit:
  rule: close < kc_middle
atr_period: 14
stop_loss_atr_mult: 1.8
take_profit_atr_mult: 3.0
max_holding_bars: 24
notes: Wider Keltner multiple for a stronger, less frequent breakout signal.
