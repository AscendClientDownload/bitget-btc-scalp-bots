id: bo_003_donchian55_breakout
name: Donchian 55 Breakout (slow)
category: breakout_volatility
timeframe: 5min
indicators:
- name: donchian_channels
  alias: dc
  params:
    period: 55
entry:
  side: long
  rule: close > donchian_upper
exit:
  rule: 'False'
atr_period: 14
stop_loss_atr_mult: 1.8
take_profit_atr_mult: 3.5
max_holding_bars: 24
notes: Classic 55-bar Turtle-system channel, fewer and larger breakout signals.
