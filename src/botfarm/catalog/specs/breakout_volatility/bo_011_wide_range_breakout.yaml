id: bo_011_wide_range_breakout
name: Wide-Range Bar Breakout
category: breakout_volatility
timeframe: 5min
indicators:
- name: donchian_channels
  alias: dc
  params:
    period: 10
entry:
  side: long
  rule: (high - low) > 1.5 * _atr and close > donchian_upper
exit:
  rule: 'False'
atr_period: 14
stop_loss_atr_mult: 1.5
take_profit_atr_mult: 2.8
max_holding_bars: 24
notes: Requires today's own bar to be unusually wide (range expansion) in addition
  to the channel breakout.
