id: bo_007_donchian20_volume_confirm
name: Donchian 20 + Volume Confirmation
category: breakout_volatility
timeframe: 5min
indicators:
- name: donchian_channels
  alias: dc
  params:
    period: 20
- name: volume_sma_ratio
  alias: vol_ratio
  params:
    period: 20
entry:
  side: long
  rule: close > donchian_upper and vol_ratio > 1.3
exit:
  rule: 'False'
atr_period: 14
stop_loss_atr_mult: 1.5
take_profit_atr_mult: 3.0
max_holding_bars: 24
notes: 20-bar channel breakout that also requires above-average volume on the breakout
  bar.
