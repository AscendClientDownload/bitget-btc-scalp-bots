id: bo_002_donchian10_breakout
name: Donchian 10 Breakout (fast)
category: breakout_volatility
timeframe: 5min
indicators:
- name: donchian_channels
  alias: dc
  params:
    period: 10
entry:
  side: long
  rule: close > donchian_upper
exit:
  rule: 'False'
atr_period: 14
stop_loss_atr_mult: 1.3
take_profit_atr_mult: 2.5
max_holding_bars: 24
notes: Shorter 10-bar channel for more frequent breakout signals.
