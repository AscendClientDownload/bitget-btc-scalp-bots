id: bo_006_bb_squeeze_breakout
name: Bollinger Squeeze Breakout
category: breakout_volatility
timeframe: 5min
indicators:
- name: bollinger_bands
  alias: bb
  params:
    period: 20
    num_std: 2.0
entry:
  side: long
  rule: (bb_upper - bb_lower) / bb_middle < 0.02 and close > bb_upper
exit:
  rule: 'False'
atr_period: 14
stop_loss_atr_mult: 1.5
take_profit_atr_mult: 2.8
max_holding_bars: 24
notes: Requires a prior volatility contraction (narrow bands) before the breakout
  above the upper band.
