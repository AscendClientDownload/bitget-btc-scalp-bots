id: bo_010_double_breakout_confluence
name: Donchian + Keltner Double Breakout
category: breakout_volatility
timeframe: 5min
indicators:
- name: donchian_channels
  alias: dc
  params:
    period: 20
- name: keltner_channels
  alias: kc
  params:
    ema_period: 20
    atr_period: 10
    atr_mult: 2.0
entry:
  side: long
  rule: close > donchian_upper and close > kc_upper
exit:
  rule: 'False'
atr_period: 14
stop_loss_atr_mult: 1.6
take_profit_atr_mult: 3.0
max_holding_bars: 24
notes: Requires both a price-channel breakout and a volatility-channel breakout to
  agree.
