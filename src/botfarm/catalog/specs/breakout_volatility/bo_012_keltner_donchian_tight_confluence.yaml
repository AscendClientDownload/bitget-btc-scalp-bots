id: bo_012_keltner_donchian_tight_confluence
name: Keltner + Donchian10 Tight Confluence
category: breakout_volatility
timeframe: 5min
indicators:
- name: donchian_channels
  alias: dc
  params:
    period: 10
- name: keltner_channels
  alias: kc
  params:
    ema_period: 20
    atr_period: 10
    atr_mult: 1.5
entry:
  side: long
  rule: close > donchian_upper and close > kc_upper
exit:
  rule: 'False'
atr_period: 14
stop_loss_atr_mult: 1.4
take_profit_atr_mult: 2.6
max_holding_bars: 24
notes: A tighter (1.5x ATR) Keltner combined with a fast 10-bar Donchian, for more
  frequent confluence signals.
