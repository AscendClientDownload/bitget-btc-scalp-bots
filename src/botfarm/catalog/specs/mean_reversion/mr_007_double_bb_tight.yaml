id: mr_007_double_bb_tight
name: Tight Bollinger Bands (1.5 std)
category: mean_reversion
timeframe: 5min
indicators:
- name: bollinger_bands
  alias: bb
  params:
    period: 20
    num_std: 1.5
- name: rsi
  alias: rsi_14
  params:
    period: 14
entry:
  side: long
  rule: close <= bb_lower and rsi_14 <= 30
exit:
  rule: close >= bb_middle or rsi_14 >= 55
atr_period: 14
stop_loss_atr_mult: 1.2
take_profit_atr_mult: 2.0
max_holding_bars: 24
notes: Narrower bands trade more often on smaller deviations.
