id: mr_009_rsi_extreme_fast
name: Fast RSI Extreme (no bands)
category: mean_reversion
timeframe: 5min
indicators:
- name: rsi
  alias: rsi_7
  params:
    period: 7
entry:
  side: long
  rule: rsi_7 <= 20
exit:
  rule: rsi_7 >= 50
atr_period: 14
stop_loss_atr_mult: 1.3
take_profit_atr_mult: 2.0
max_holding_bars: 24
notes: Momentum-only entry via a fast 7-period RSI extreme, no price-band requirement.
