id: mr_010_bb_volume_climax
name: BB Reversion + Volume Climax
category: mean_reversion
timeframe: 5min
indicators:
- name: bollinger_bands
  alias: bb
  params:
    period: 20
    num_std: 2.0
- name: volume_sma_ratio
  alias: vol_ratio
  params:
    period: 20
entry:
  side: long
  rule: close <= bb_lower and vol_ratio > 1.5
exit:
  rule: close >= bb_middle
atr_period: 14
stop_loss_atr_mult: 1.5
take_profit_atr_mult: 2.5
max_holding_bars: 24
notes: Band touch plus a volume spike, betting on capitulation-driven reversals.
