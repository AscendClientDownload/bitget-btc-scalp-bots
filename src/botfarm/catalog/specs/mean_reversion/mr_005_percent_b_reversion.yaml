id: mr_005_percent_b_reversion
name: Bollinger %B Reversion
category: mean_reversion
timeframe: 5min
indicators:
- name: percent_b
  alias: pct_b
  params:
    period: 20
    num_std: 2.0
entry:
  side: long
  rule: pct_b <= 0.05
exit:
  rule: pct_b >= 0.5
atr_period: 14
stop_loss_atr_mult: 1.5
take_profit_atr_mult: 2.5
max_holding_bars: 24
notes: Entry via %B (position within the bands) instead of a raw band-touch comparison.
