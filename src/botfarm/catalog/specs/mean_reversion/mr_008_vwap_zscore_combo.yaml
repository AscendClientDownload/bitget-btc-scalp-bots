id: mr_008_vwap_zscore_combo
name: VWAP + Z-Score Confluence
category: mean_reversion
timeframe: 5min
indicators:
- name: rolling_vwap
  alias: vwap
  params:
    period: 20
- name: zscore
  alias: z
  params:
    period: 20
entry:
  side: long
  rule: close < vwap and z <= -1.5
exit:
  rule: close > vwap
atr_period: 14
stop_loss_atr_mult: 1.5
take_profit_atr_mult: 2.5
max_holding_bars: 24
notes: Two independent deviation measures (VWAP and z-score) must agree.
