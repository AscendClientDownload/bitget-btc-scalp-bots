id: mr_011_percent_b_rsi_combo
name: '%B + RSI Combo'
category: mean_reversion
timeframe: 5min
indicators:
- name: percent_b
  alias: pct_b
  params:
    period: 20
    num_std: 2.0
- name: rsi
  alias: rsi_14
  params:
    period: 14
entry:
  side: long
  rule: pct_b <= 0.1 and rsi_14 <= 35
exit:
  rule: pct_b >= 0.5 or rsi_14 >= 55
atr_period: 14
stop_loss_atr_mult: 1.5
take_profit_atr_mult: 2.5
max_holding_bars: 24
notes: '%B and RSI both required to confirm the same oversold state.'
