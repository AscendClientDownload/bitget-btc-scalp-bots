id: mr_002_bb_wide_rsi_deep
name: Wide Bands + Deep RSI Oversold
category: mean_reversion
timeframe: 5min
indicators:
- name: bollinger_bands
  alias: bb
  params:
    period: 20
    num_std: 2.5
- name: rsi
  alias: rsi_14
  params:
    period: 14
entry:
  side: long
  rule: close <= bb_lower and rsi_14 <= 25
exit:
  rule: close >= bb_middle or rsi_14 >= 50
atr_period: 14
stop_loss_atr_mult: 1.5
take_profit_atr_mult: 2.5
max_holding_bars: 24
notes: Wider bands (2.5 std) and a stricter RSI threshold for rarer, more extreme
  entries.
