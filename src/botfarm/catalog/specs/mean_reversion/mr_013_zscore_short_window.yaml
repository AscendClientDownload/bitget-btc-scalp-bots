id: mr_013_zscore_short_window
name: Z-Score Reversion (14-bar, tight)
category: mean_reversion
timeframe: 5min
indicators:
- name: zscore
  alias: z
  params:
    period: 14
entry:
  side: long
  rule: z <= -1.8
exit:
  rule: z >= 0.3
atr_period: 14
stop_loss_atr_mult: 1.3
take_profit_atr_mult: 2.2
max_holding_bars: 24
notes: Shorter lookback z-score for a more reactive statistical entry, exits on overshoot
  past the mean.
