id: mr_012_vwap_bb_confluence
name: VWAP + Bollinger Confluence
category: mean_reversion
timeframe: 5min
indicators:
- name: rolling_vwap
  alias: vwap
  params:
    period: 20
- name: bollinger_bands
  alias: bb
  params:
    period: 20
    num_std: 2.0
entry:
  side: long
  rule: close < vwap and close <= bb_lower
exit:
  rule: close > vwap and close >= bb_middle
atr_period: 14
stop_loss_atr_mult: 1.5
take_profit_atr_mult: 2.5
max_holding_bars: 24
notes: Two independent mean levels (VWAP, Bollinger middle) must both be breached.
