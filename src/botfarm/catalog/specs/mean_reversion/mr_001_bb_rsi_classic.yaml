id: mr_001_bb_rsi_classic
name: Bollinger + RSI Classic Reversion
category: mean_reversion
timeframe: 5min
indicators:
- name: bollinger_bands
  alias: bb
  params:
    period: 20
    num_std: 2.0
- name: rsi
  alias: rsi_14
  params:
    period: 14
entry:
  side: long
  rule: close <= bb_lower and rsi_14 <= 30
exit:
  rule: close >= bb_middle or rsi_14 >= 55
atr_period: 14
stop_loss_atr_mult: 1.5
take_profit_atr_mult: 2.5
max_holding_bars: 24
notes: The textbook BB-touch + RSI-oversold mean-reversion entry.
