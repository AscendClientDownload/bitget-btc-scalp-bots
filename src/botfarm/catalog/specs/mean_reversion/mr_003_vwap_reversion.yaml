id: mr_003_vwap_reversion
name: VWAP Deviation Reversion
category: mean_reversion
timeframe: 5min
indicators:
- name: rolling_vwap
  alias: vwap
  params:
    period: 20
- name: rsi
  alias: rsi_14
  params:
    period: 14
entry:
  side: long
  rule: close < vwap * 0.998 and rsi_14 <= 35
exit:
  rule: close > vwap or rsi_14 >= 55
atr_period: 14
stop_loss_atr_mult: 1.5
take_profit_atr_mult: 2.5
max_holding_bars: 24
notes: Price deviated 0.2% below its rolling VWAP with RSI confirmation.
