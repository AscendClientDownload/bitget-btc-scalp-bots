id: cp_010_engulfing_adx_filter
name: Engulfing in Early Trend (low ADX)
category: candlestick_pattern
timeframe: 5min
indicators:
- name: adx
  alias: adx
  params:
    period: 14
entry:
  side: long
  rule: close > open and prev_close < prev_open and close > prev_open and open < prev_close
    and adx <= 25
exit:
  rule: adx >= 40
atr_period: 14
stop_loss_atr_mult: 1.3
take_profit_atr_mult: 2.0
max_holding_bars: 24
notes: Engulfing pattern restricted to a not-yet-strongly-trending regime, catching
  earlier reversals.
