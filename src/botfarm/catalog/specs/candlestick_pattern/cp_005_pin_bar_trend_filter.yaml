id: cp_005_pin_bar_trend_filter
name: Pin Bar Rejection in Uptrend
category: candlestick_pattern
timeframe: 5min
indicators:
- name: ema
  alias: ema_trend
  params:
    period: 20
entry:
  side: long
  rule: (close - low) > 0.6 * (high - low) and close > open and close > ema_trend
exit:
  rule: close < ema_trend
atr_period: 14
stop_loss_atr_mult: 1.3
take_profit_atr_mult: 2.0
max_holding_bars: 24
notes: Same rejection-wick pattern as the plain hammer, but only taken above the trend
  EMA.
