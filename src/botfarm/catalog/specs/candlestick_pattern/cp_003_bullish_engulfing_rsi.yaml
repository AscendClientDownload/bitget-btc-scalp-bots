id: cp_003_bullish_engulfing_rsi
name: Bullish Engulfing at Pullback (RSI filter)
category: candlestick_pattern
timeframe: 5min
indicators:
- name: rsi
  alias: rsi_14
  params:
    period: 14
entry:
  side: long
  rule: close > open and prev_close < prev_open and close > prev_open and open < prev_close
    and rsi_14 <= 40
exit:
  rule: rsi_14 >= 60
atr_period: 14
stop_loss_atr_mult: 1.3
take_profit_atr_mult: 2.0
max_holding_bars: 24
notes: Engulfing pattern restricted to a pullback context (RSI<=40) rather than any
  location.
