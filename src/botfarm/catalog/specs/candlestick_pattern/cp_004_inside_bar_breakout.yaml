id: cp_004_inside_bar_breakout
name: Inside Bar Breakout
category: candlestick_pattern
timeframe: 5min
indicators: []
entry:
  side: long
  rule: prev_high < prev2_high and prev_low > prev2_low and close > prev2_high
exit:
  rule: 'False'
atr_period: 14
stop_loss_atr_mult: 1.3
take_profit_atr_mult: 2.0
max_holding_bars: 24
notes: 'Three-bar pattern: an inside bar followed by a breakout above the "mother
  bar" high.'
