id: cp_012_three_bar_higher_lows_rsi
name: Higher Lows + Neutral RSI
category: candlestick_pattern
timeframe: 5min
indicators:
- name: rsi
  alias: rsi_14
  params:
    period: 14
entry:
  side: long
  rule: low > prev_low and prev_low > prev2_low and close > open and rsi_14 >= 45
    and rsi_14 <= 60
exit:
  rule: rsi_14 >= 70
atr_period: 14
stop_loss_atr_mult: 1.2
take_profit_atr_mult: 1.8
max_holding_bars: 24
notes: Ascending-lows pattern restricted to a neutral (not-yet-overbought) RSI band.
