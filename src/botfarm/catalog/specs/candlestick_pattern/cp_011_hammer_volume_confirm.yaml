id: cp_011_hammer_volume_confirm
name: Hammer + Volume Confirmation
category: candlestick_pattern
timeframe: 5min
indicators:
- name: volume_sma_ratio
  alias: vol_ratio
  params:
    period: 20
entry:
  side: long
  rule: (close - low) > 0.6 * (high - low) and (open - low) > 0.6 * (high - low) and
    close >= open and vol_ratio > 1.2
exit:
  rule: 'False'
atr_period: 14
stop_loss_atr_mult: 1.3
take_profit_atr_mult: 2.0
max_holding_bars: 24
notes: Hammer/pin-bar pattern with an added volume-confirmation requirement.
