id: cp_013_inside_bar_breakout_volume
name: Inside Bar Breakout + Volume
category: candlestick_pattern
timeframe: 5min
indicators:
- name: volume_sma_ratio
  alias: vol_ratio
  params:
    period: 20
entry:
  side: long
  rule: prev_high < prev2_high and prev_low > prev2_low and close > prev2_high and
    vol_ratio > 1.3
exit:
  rule: 'False'
atr_period: 14
stop_loss_atr_mult: 1.3
take_profit_atr_mult: 2.0
max_holding_bars: 24
notes: Inside-bar breakout pattern that also requires a volume spike on the breakout
  bar.
