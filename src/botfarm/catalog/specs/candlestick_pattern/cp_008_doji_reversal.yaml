id: cp_008_doji_reversal
name: Doji at Oversold RSI
category: candlestick_pattern
timeframe: 5min
indicators:
- name: rsi
  alias: rsi_14
  params:
    period: 14
entry:
  side: long
  rule: (high - low) > 0 and (close - open) < 0.15 * (high - low) and (open - close)
    < 0.15 * (high - low) and rsi_14 <= 35
exit:
  rule: rsi_14 >= 55
atr_period: 14
stop_loss_atr_mult: 1.3
take_profit_atr_mult: 2.0
max_holding_bars: 24
notes: A small-bodied (indecision) bar occurring while RSI is oversold.
