id: tf_011_ema_cross_vol_filter
name: EMA Cross + Volume Confirmation
category: trend_following
timeframe: 5min
indicators:
- name: ema
  alias: ema_fast
  params:
    period: 9
- name: ema
  alias: ema_slow
  params:
    period: 21
- name: cross_above
  alias: ema_cross_up
  params:
    a: ema_fast
    b: ema_slow
- name: volume_sma_ratio
  alias: vol_ratio
  params:
    period: 20
entry:
  side: long
  rule: ema_cross_up and vol_ratio > 1.2
exit:
  rule: 'False'
atr_period: 14
stop_loss_atr_mult: 1.0
take_profit_atr_mult: 1.5
max_holding_bars: 24
notes: EMA cross requiring above-average volume on the crossing bar.
