id: tf_002_ema5_13_cross
name: EMA 5/13 Cross (fast)
category: trend_following
timeframe: 5min
indicators:
- name: ema
  alias: ema_fast
  params:
    period: 5
- name: ema
  alias: ema_slow
  params:
    period: 13
- name: cross_above
  alias: ema_cross_up
  params:
    a: ema_fast
    b: ema_slow
entry:
  side: long
  rule: ema_cross_up
exit:
  rule: 'False'
atr_period: 14
stop_loss_atr_mult: 1.0
take_profit_atr_mult: 1.5
max_holding_bars: 24
notes: Faster EMA pair for quicker (noisier) trend entries.
