id: tf_010_ema_cross_adx_filter
name: EMA Cross + ADX Trend Filter
category: trend_following
timeframe: 5min
indicators:
- name: ema
  alias: ema_fast
  params:
    period: 9
- name: ema
  alias: ema_slow
  params:
    period: 21
- name: cross_above
  alias: ema_cross_up
  params:
    a: ema_fast
    b: ema_slow
- name: adx
  alias: adx
  params:
    period: 14
entry:
  side: long
  rule: ema_cross_up and adx >= 20
exit:
  rule: 'False'
atr_period: 14
stop_loss_atr_mult: 1.0
take_profit_atr_mult: 1.5
max_holding_bars: 24
notes: EMA cross gated by ADX>=20 so it only fires in confirmed-trending conditions.
