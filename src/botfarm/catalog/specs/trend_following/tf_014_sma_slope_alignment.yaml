id: tf_014_sma_slope_alignment
name: SMA20 above SMA50 Alignment
category: trend_following
timeframe: 5min
indicators:
- name: sma
  alias: sma20
  params:
    period: 20
- name: sma
  alias: sma50
  params:
    period: 50
entry:
  side: long
  rule: close > sma20 and sma20 > sma50
exit:
  rule: close < sma20
atr_period: 14
stop_loss_atr_mult: 1.3
take_profit_atr_mult: 2.0
max_holding_bars: 24
notes: Price/short-MA/long-MA alignment filter, a slope proxy without an explicit
  cross event.
