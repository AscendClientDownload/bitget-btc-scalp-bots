id: tf_012_dual_ema_ribbon
name: Triple EMA Ribbon Alignment
category: trend_following
timeframe: 5min
indicators:
- name: ema
  alias: ema9
  params:
    period: 9
- name: ema
  alias: ema21
  params:
    period: 21
- name: ema
  alias: ema50
  params:
    period: 50
entry:
  side: long
  rule: close > ema9 and ema9 > ema21 and ema21 > ema50
exit:
  rule: close < ema21
atr_period: 14
stop_loss_atr_mult: 1.3
take_profit_atr_mult: 2.0
max_holding_bars: 24
notes: No single cross event -- entry requires price and three EMAs already stacked
  in trend order.
