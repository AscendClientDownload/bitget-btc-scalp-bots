id: mo_004_roc_positive_cross
name: Rate of Change Crosses Above Zero
category: momentum_oscillator
timeframe: 5min
indicators:
- name: roc
  alias: roc_12
  params:
    period: 12
- name: cross_above
  alias: roc_cross_up
  params:
    a: roc_12
    b: 0
entry:
  side: long
  rule: roc_cross_up
exit:
  rule: roc_12 < 0
atr_period: 14
stop_loss_atr_mult: 1.3
take_profit_atr_mult: 2.0
max_holding_bars: 24
notes: 12-bar rate of change turning positive.
