id: mo_002_stoch_cross_20
name: Stochastic %K Crosses Above 20
category: momentum_oscillator
timeframe: 5min
indicators:
- name: stochastic
  alias: stoch
  params:
    k_period: 14
    d_period: 3
- name: cross_above
  alias: stoch_cross_up
  params:
    a: stoch_k
    b: 20
entry:
  side: long
  rule: stoch_cross_up
exit:
  rule: stoch_k > 80
atr_period: 14
stop_loss_atr_mult: 1.3
take_profit_atr_mult: 2.0
max_holding_bars: 24
notes: Stochastic %K leaving the oversold zone from below 20.
