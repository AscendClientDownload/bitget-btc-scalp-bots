id: mo_008_rsi_stoch_combo
name: RSI + Stochastic Momentum Combo
category: momentum_oscillator
timeframe: 5min
indicators:
- name: rsi
  alias: rsi_14
  params:
    period: 14
- name: stochastic
  alias: stoch
  params:
    k_period: 14
    d_period: 3
entry:
  side: long
  rule: rsi_14 > 50 and stoch_k > stoch_d
exit:
  rule: rsi_14 < 45
atr_period: 14
stop_loss_atr_mult: 1.3
take_profit_atr_mult: 2.0
max_holding_bars: 24
notes: Two independent momentum oscillators (RSI, Stochastic) must both confirm.
