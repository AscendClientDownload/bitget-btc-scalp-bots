id: mo_012_rsi_fast_7_cross
name: Fast RSI(7) Crosses 50
category: momentum_oscillator
timeframe: 5min
indicators:
- name: rsi
  alias: rsi_7
  params:
    period: 7
- name: cross_above
  alias: rsi_cross_up
  params:
    a: rsi_7
    b: 50
entry:
  side: long
  rule: rsi_cross_up
exit:
  rule: rsi_7 < 40
atr_period: 14
stop_loss_atr_mult: 1.2
take_profit_atr_mult: 1.8
max_holding_bars: 24
notes: Faster 7-period RSI for quicker momentum-turn signals.
