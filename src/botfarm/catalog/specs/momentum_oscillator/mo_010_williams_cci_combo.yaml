id: mo_010_williams_cci_combo
name: Williams %R + CCI Combo
category: momentum_oscillator
timeframe: 5min
indicators:
- name: williams_r
  alias: wr
  params:
    period: 14
- name: cci
  alias: cci
  params:
    period: 20
- name: cross_above
  alias: wr_cross_up
  params:
    a: wr
    b: -80
entry:
  side: long
  rule: wr_cross_up and cci < -50
exit:
  rule: wr > -20
atr_period: 14
stop_loss_atr_mult: 1.4
take_profit_atr_mult: 2.2
max_holding_bars: 24
notes: Williams %R reversal while CCI is still in oversold territory (early-stage
  recovery).
