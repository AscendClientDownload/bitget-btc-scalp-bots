id: mo_009_roc_rsi_combo
name: ROC + RSI Not-Yet-Overbought Combo
category: momentum_oscillator
timeframe: 5min
indicators:
- name: roc
  alias: roc_12
  params:
    period: 12
- name: rsi
  alias: rsi_14
  params:
    period: 14
entry:
  side: long
  rule: roc_12 > 0 and rsi_14 >= 45 and rsi_14 <= 65
exit:
  rule: roc_12 < 0
atr_period: 14
stop_loss_atr_mult: 1.3
take_profit_atr_mult: 2.0
max_holding_bars: 24
notes: Positive momentum while RSI is in a neutral band, avoiding entries already
  near overbought.
