id: mo_001_rsi_cross_50
name: RSI Crosses Above 50
category: momentum_oscillator
timeframe: 5min
indicators:
- name: rsi
  alias: rsi_14
  params:
    period: 14
- name: cross_above
  alias: rsi_cross_up
  params:
    a: rsi_14
    b: 50
entry:
  side: long
  rule: rsi_cross_up
exit:
  rule: rsi_14 < 45
atr_period: 14
stop_loss_atr_mult: 1.3
take_profit_atr_mult: 2.0
max_holding_bars: 24
notes: RSI turning positive (crossing its own 50 midline) rather than an oversold-extreme
  entry.
