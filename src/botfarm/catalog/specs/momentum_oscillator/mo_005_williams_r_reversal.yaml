id: mo_005_williams_r_reversal
name: Williams %R Reversal
category: momentum_oscillator
timeframe: 5min
indicators:
- name: williams_r
  alias: wr
  params:
    period: 14
- name: cross_above
  alias: wr_cross_up
  params:
    a: wr
    b: -80
entry:
  side: long
  rule: wr_cross_up
exit:
  rule: wr > -20
atr_period: 14
stop_loss_atr_mult: 1.3
take_profit_atr_mult: 2.0
max_holding_bars: 24
notes: Williams %R crossing back above -80 (leaving the oversold extreme).
