id: mo_013_triple_momentum_confluence
name: Triple Momentum Confluence
category: momentum_oscillator
timeframe: 5min
indicators:
- name: rsi
  alias: rsi_14
  params:
    period: 14
- name: stochastic
  alias: stoch
  params:
    k_period: 14
    d_period: 3
- name: roc
  alias: roc_12
  params:
    period: 12
entry:
  side: long
  rule: rsi_14 > 50 and stoch_k > stoch_d and roc_12 > 0
exit:
  rule: rsi_14 < 45
atr_period: 14
stop_loss_atr_mult: 1.4
take_profit_atr_mult: 2.2
max_holding_bars: 24
notes: Three independent momentum measures (RSI, Stochastic, ROC) all agreeing.
