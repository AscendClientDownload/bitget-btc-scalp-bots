id: mo_011_stoch_slow_21
name: Slow Stochastic (21-period)
category: momentum_oscillator
timeframe: 5min
indicators:
- name: stochastic
  alias: stoch
  params:
    k_period: 21
    d_period: 5
- name: cross_above
  alias: stoch_cross_up
  params:
    a: stoch_k
    b: 20
entry:
  side: long
  rule: stoch_cross_up
exit:
  rule: stoch_k > 80
atr_period: 14
stop_loss_atr_mult: 1.4
take_profit_atr_mult: 2.2
max_holding_bars: 24
notes: Longer-period stochastic for a smoother, less noisy signal.
