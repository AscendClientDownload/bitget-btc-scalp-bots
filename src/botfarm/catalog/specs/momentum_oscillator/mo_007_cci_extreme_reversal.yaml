id: mo_007_cci_extreme_reversal
name: CCI Extreme Reversal
category: momentum_oscillator
timeframe: 5min
indicators:
- name: cci
  alias: cci
  params:
    period: 20
- name: cross_above
  alias: cci_cross_up
  params:
    a: cci
    b: -100
entry:
  side: long
  rule: cci_cross_up
exit:
  rule: cci > 100
atr_period: 14
stop_loss_atr_mult: 1.4
take_profit_atr_mult: 2.2
max_holding_bars: 24
notes: CCI recovering from an extreme oversold reading below -100.
