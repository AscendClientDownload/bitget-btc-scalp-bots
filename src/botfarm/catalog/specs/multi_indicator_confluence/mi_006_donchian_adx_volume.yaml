id: mi_006_donchian_adx_volume
name: Donchian Breakout + ADX + Volume
category: multi_indicator_confluence
timeframe: 5min
indicators:
- name: donchian_channels
  alias: dc
  params:
    period: 20
- name: adx
  alias: adx
  params:
    period: 14
- name: volume_sma_ratio
  alias: vol_ratio
  params:
    period: 20
entry:
  side: long
  rule: close > donchian_upper and adx >= 20 and vol_ratio > 1.2
exit:
  rule: 'False'
atr_period: 14
stop_loss_atr_mult: 1.6
take_profit_atr_mult: 3.0
max_holding_bars: 24
notes: Channel breakout confirmed by both trend strength and volume.
