id: mi_007_stoch_macd_confirm
name: Stochastic + MACD Dual Cross
category: multi_indicator_confluence
timeframe: 5min
indicators:
- name: stochastic
  alias: stoch
  params:
    k_period: 14
    d_period: 3
- name: macd
  alias: macd
  params:
    fast: 12
    slow: 26
    signal: 9
entry:
  side: long
  rule: stoch_k > stoch_d and macd_line > macd_signal
exit:
  rule: stoch_k > 80
atr_period: 14
stop_loss_atr_mult: 1.3
take_profit_atr_mult: 2.0
max_holding_bars: 24
notes: Two independent crossing systems (Stochastic %K/%D, MACD/signal) both bullish
  simultaneously.
