id: mi_012_five_factor_confluence
name: Four-Factor High-Conviction Confluence
category: multi_indicator_confluence
timeframe: 5min
indicators:
- name: ema
  alias: ema_fast
  params:
    period: 9
- name: ema
  alias: ema_slow
  params:
    period: 21
- name: cross_above
  alias: ema_cross_up
  params:
    a: ema_fast
    b: ema_slow
- name: rsi
  alias: rsi_14
  params:
    period: 14
- name: adx
  alias: adx
  params:
    period: 14
- name: volume_sma_ratio
  alias: vol_ratio
  params:
    period: 20
entry:
  side: long
  rule: ema_cross_up and rsi_14 >= 50 and rsi_14 <= 68 and adx >= 18 and vol_ratio
    > 1.1
exit:
  rule: 'False'
atr_period: 14
stop_loss_atr_mult: 1.2
take_profit_atr_mult: 2.0
max_holding_bars: 24
notes: 'The "kitchen sink" variant: trend cross, momentum band, trend strength, and
  volume all required together.'
