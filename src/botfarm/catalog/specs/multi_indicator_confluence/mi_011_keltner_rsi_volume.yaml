id: mi_011_keltner_rsi_volume
name: Keltner Breakout + RSI + Volume
category: multi_indicator_confluence
timeframe: 5min
indicators:
- name: keltner_channels
  alias: kc
  params:
    ema_period: 20
    atr_period: 10
    atr_mult: 2.0
- name: rsi
  alias: rsi_14
  params:
    period: 14
- name: volume_sma_ratio
  alias: vol_ratio
  params:
    period: 20
entry:
  side: long
  rule: close > kc_upper and rsi_14 > 55 and vol_ratio > 1.3
exit:
  rule: close < kc_middle
atr_period: 14
stop_loss_atr_mult: 1.5
take_profit_atr_mult: 2.5
max_holding_bars: 24
notes: Volatility-channel breakout confirmed by both momentum and volume.
