id: mi_009_cci_ema_volume
name: CCI Reversal + EMA Trend + Volume
category: multi_indicator_confluence
timeframe: 5min
indicators:
- name: cci
  alias: cci
  params:
    period: 20
- name: ema
  alias: ema_trend
  params:
    period: 50
- name: volume_sma_ratio
  alias: vol_ratio
  params:
    period: 20
- name: cross_above
  alias: cci_cross_up
  params:
    a: cci
    b: -100
entry:
  side: long
  rule: cci_cross_up and close > ema_trend and vol_ratio > 1.0
exit:
  rule: cci > 150
atr_period: 14
stop_loss_atr_mult: 1.4
take_profit_atr_mult: 2.2
max_holding_bars: 24
notes: Momentum reversal (CCI) only taken in the direction of the longer-term EMA
  trend, with volume.
