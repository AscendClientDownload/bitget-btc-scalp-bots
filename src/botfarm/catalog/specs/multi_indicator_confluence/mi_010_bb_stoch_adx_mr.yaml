id: mi_010_bb_stoch_adx_mr
name: BB + Stochastic + ADX Mean-Reversion
category: multi_indicator_confluence
timeframe: 5min
indicators:
- name: bollinger_bands
  alias: bb
  params:
    period: 20
    num_std: 2.0
- name: stochastic
  alias: stoch
  params:
    k_period: 14
    d_period: 3
- name: adx
  alias: adx
  params:
    period: 14
entry:
  side: long
  rule: close <= bb_lower and stoch_k <= 20 and adx <= 20
exit:
  rule: close >= bb_middle or stoch_k >= 50
atr_period: 14
stop_loss_atr_mult: 1.5
take_profit_atr_mult: 2.5
max_holding_bars: 24
notes: 'Full mean-reversion confluence with a regime filter: band touch, oversold
  stochastic, non-trending ADX.'
