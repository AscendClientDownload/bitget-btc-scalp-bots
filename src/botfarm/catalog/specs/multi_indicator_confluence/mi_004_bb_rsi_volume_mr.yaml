id: mi_004_bb_rsi_volume_mr
name: BB + RSI + Volume Mean-Reversion
category: multi_indicator_confluence
timeframe: 5min
indicators:
- name: bollinger_bands
  alias: bb
  params:
    period: 20
    num_std: 2.0
- name: rsi
  alias: rsi_14
  params:
    period: 14
- name: volume_sma_ratio
  alias: vol_ratio
  params:
    period: 20
entry:
  side: long
  rule: close <= bb_lower and rsi_14 <= 30 and vol_ratio > 1.3
exit:
  rule: close >= bb_middle or rsi_14 >= 55
atr_period: 14
stop_loss_atr_mult: 1.5
take_profit_atr_mult: 2.5
max_holding_bars: 24
notes: 'Full mean-reversion confluence: band touch, RSI oversold, and a volume spike,
  all three required.'
