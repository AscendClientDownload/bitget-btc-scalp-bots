id: mi_005_triple_ma_rsi
name: Triple MA Alignment + RSI
category: multi_indicator_confluence
timeframe: 5min
indicators:
- name: sma
  alias: sma20
  params:
    period: 20
- name: sma
  alias: sma50
  params:
    period: 50
- name: rsi
  alias: rsi_14
  params:
    period: 14
entry:
  side: long
  rule: close > sma20 and sma20 > sma50 and rsi_14 >= 50 and rsi_14 <= 65
exit:
  rule: close < sma20
atr_period: 14
stop_loss_atr_mult: 1.3
take_profit_atr_mult: 2.0
max_holding_bars: 24
notes: MA alignment filter combined with a momentum band, not just a bare crossover.
