id: mi_001_ema_rsi_volume
name: EMA Cross + RSI + Volume
category: multi_indicator_confluence
timeframe: 5min
indicators:
- name: ema
  alias: ema_fast
  params:
    period: 9
- name: ema
  alias: ema_slow
  params:
    period: 21
- name: cross_above
  alias: ema_cross_up
  params:
    a: ema_fast
    b: ema_slow
- name: rsi
  alias: rsi_14
  params:
    period: 14
- name: volume_sma_ratio
  alias: vol_ratio
  params:
    period: 20
entry:
  side: long
  rule: ema_cross_up and rsi_14 >= 50 and rsi_14 <= 70 and vol_ratio > 1.0
exit:
  rule: 'False'
atr_period: 14
stop_loss_atr_mult: 1.0
take_profit_atr_mult: 1.5
max_holding_bars: 24
notes: 'The bot #1 reference pattern: trend cross + momentum band + volume confirmation,
  as a catalog entry.'
