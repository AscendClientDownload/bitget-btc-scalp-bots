<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>botfarm — paper trading dashboard</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #0f1115; color: #e6e6e6; margin: 0; padding: 24px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .subtitle { color: #9aa0a6; font-size: 13px; margin-bottom: 20px; }
  .summary { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
  .stat { background: #1a1d24; border: 1px solid #2a2e37; border-radius: 8px; padding: 12px 16px; min-width: 120px; }
  .stat .label { font-size: 11px; color: #9aa0a6; text-transform: uppercase; letter-spacing: 0.04em; }
  .stat .value { font-size: 20px; font-weight: 600; margin-top: 4px; }
  .value.pos { color: #4ade80; }
  .value.neg { color: #f87171; }
  section { margin-bottom: 32px; }
  h2 { font-size: 14px; font-weight: 600; margin: 0 0 10px; color: #cfd3da; }
  .empty { color: #6b7078; padding: 16px; font-size: 13px; background: #14161b; border: 1px dashed #2a2e37; border-radius: 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }

  .card { background: #14161b; border: 1px solid #2a2e37; border-radius: 10px; padding: 14px 16px; }
  .card.win { border-left: 3px solid #4ade80; }
  .card.loss { border-left: 3px solid #f87171; }
  .card.open { border-left: 3px solid #7cc4ff; }
  .card-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .card-bot { font-weight: 600; font-size: 13px; }
  .card-pnl { font-size: 16px; font-weight: 700; }
  .card-pnl.pos { color: #4ade80; }
  .card-pnl.neg { color: #f87171; }
  .card-rows { font-size: 12px; color: #b8bcc4; display: flex; flex-direction: column; gap: 4px; }
  .card-rows .row { display: flex; justify-content: space-between; gap: 8px; }
  .card-rows .row span:first-child { color: #7d828b; }
  .badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge.open { background: #1e3a5f; color: #7cc4ff; }
  .badge.stop_loss { background: #4a1e1e; color: #f87171; }
  .badge.take_profit { background: #1e4a2a; color: #4ade80; }
  .badge.time_stop { background: #3a3520; color: #eab308; }
  .badge.signal { background: #2a2035; color: #c084fc; }

  .bot-box { background: #14161b; border: 1px solid #2a2e37; border-radius: 10px; padding: 14px 16px; min-width: 220px; cursor: pointer; transition: border-color 0.15s; }
  .bot-box:hover { border-color: #4a5568; }
  .bot-box.selected { border-color: #7cc4ff; box-shadow: 0 0 0 1px #7cc4ff; }
  .bot-box .name { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .bot-box .status { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: 600; margin-bottom: 10px; }
  .bot-box .status.idle { background: #23262e; color: #9aa0a6; }
  .bot-box .status.in-position { background: #1e3a5f; color: #7cc4ff; }
  .bot-box .pnl-line { font-size: 18px; font-weight: 700; margin-bottom: 10px; }
  .filter-note { color: #7cc4ff; font-size: 12px; margin-bottom: 10px; cursor: pointer; }
  .more-note { color: #6b7078; font-size: 12px; margin-top: 8px; }
  .updated { color: #6b7078; font-size: 11px; margin-top: 8px; }
</style>
</head>
<body>
<h1>botfarm — paper trading dashboard</h1>
<div class="subtitle">Local only · simulated fills, no real orders placed · refreshes every 5s</div>

<div class="summary" id="summary"></div>

<section>
  <h2>Bots</h2>
  <div class="grid" id="bots"></div>
</section>

<div class="filter-note" id="filter-note" style="display:none"></div>

<section>
  <h2>Open positions</h2>
  <div class="grid" id="open-trades"></div>
</section>

<section>
  <h2>Closed trades</h2>
  <div class="grid" id="closed-trades"></div>
  <div class="more-note" id="closed-more"></div>
</section>

<div class="updated" id="updated"></div>

<script>
const CLOSED_TRADES_SHOWN = 60;
let selectedBot = null; // click a bot card to filter open/closed trades to just that bot

function fmtPct(v) { return (v === null || v === undefined) ? "—" : (v * 100).toFixed(3) + "%"; }
function fmtSignedPct(v) { return (v === null || v === undefined) ? "—" : (v >= 0 ? "+" : "") + (v * 100).toFixed(3) + "%"; }
function fmtMoney(v) { return (v === null || v === undefined) ? "—" : "$" + Number(v).toLocaleString(undefined, {maximumFractionDigits: 2}); }
function fmtSignedMoney(v) { return (v === null || v === undefined) ? "—" : (v >= 0 ? "+$" : "-$") + Math.abs(v).toLocaleString(undefined, {maximumFractionDigits: 2}); }
function fmtTime(ms) { return ms ? new Date(ms).toLocaleString() : "—"; }
function durMin(a, b) { return a && b ? ((b - a) / 60000).toFixed(1) + " min" : "—"; }

async function refresh() {
  const [summary, botStates, openTrades, closedTrades] = await Promise.all([
    fetch("/api/summary").then(r => r.json()),
    fetch("/api/strategies").then(r => r.json()),
    fetch("/api/trades/open").then(r => r.json()),
    fetch("/api/trades/closed").then(r => r.json()),
  ]);
  renderSummary(summary);
  renderBots(botStates, openTrades);
  renderFilterNote();
  renderOpen(selectedBot ? openTrades.filter(t => t.strategy_id === selectedBot) : openTrades);
  renderClosed(selectedBot ? closedTrades.filter(t => t.strategy_id === selectedBot) : closedTrades);
  document.getElementById("updated").textContent = "Last updated " + new Date().toLocaleTimeString();
}

function renderFilterNote() {
  const el = document.getElementById("filter-note");
  if (selectedBot) {
    el.style.display = "block";
    el.textContent = `Showing trades for ${selectedBot} only — click it again, or click here, to show all bots.`;
    el.onclick = () => { selectedBot = null; refresh(); };
  } else {
    el.style.display = "none";
  }
}

function renderSummary(s) {
  const pnlClass = s.total_pnl_dollars > 0 ? "pos" : (s.total_pnl_dollars < 0 ? "neg" : "");
  const stats = [
    ["Total P&L", fmtSignedMoney(s.total_pnl_dollars) + "  (" + s.total_pnl_pct.toFixed(2) + "%)", pnlClass],
    ["Win rate", s.win_rate_pct.toFixed(1) + "%", ""],
    ["Profit factor", isFinite(s.profit_factor) ? s.profit_factor.toFixed(2) : "∞", ""],
    ["Closed trades", s.num_closed_trades, ""],
    ["Open positions", s.open_positions, ""],
    ["Avg duration", s.avg_duration_min.toFixed(1) + "m", ""],
  ];
  document.getElementById("summary").innerHTML = stats.map(([label, value, cls]) =>
    `<div class="stat"><div class="label">${label}</div><div class="value ${cls}">${value}</div></div>`
  ).join("");
}

function renderBots(botStates, openTrades) {
  const el = document.getElementById("bots");
  if (!botStates.length) {
    el.innerHTML = '<div class="empty">No bots have started trading yet. Start scripts/run_paper_trading.py to begin.</div>';
    return;
  }
  const openByBot = {};
  openTrades.forEach(t => { openByBot[t.strategy_id] = t; });

  el.innerHTML = botStates.map(b => {
    const inPos = openByBot[b.strategy_id];
    const pnlClass = b.pnl_dollars > 0 ? "pos" : (b.pnl_dollars < 0 ? "neg" : "");
    const isSelected = selectedBot === b.strategy_id;
    return `<div class="bot-box ${isSelected ? 'selected' : ''}" data-bot="${b.strategy_id}">
      <div class="name">${b.strategy_id}</div>
      <div class="status ${inPos ? 'in-position' : 'idle'}">${inPos ? 'In position' : 'Idle — watching'}</div>
      <div class="pnl-line value ${pnlClass}">${fmtSignedMoney(b.pnl_dollars)} <span style="font-size:13px;font-weight:500;color:#9aa0a6">(${b.pnl_pct >= 0 ? '+' : ''}${b.pnl_pct.toFixed(2)}%)</span></div>
      <div class="card-rows">
        <div class="row"><span>Symbol</span><span>${b.symbol}</span></div>
        <div class="row"><span>Timeframe</span><span>${b.timeframe}</span></div>
        <div class="row"><span>Started with</span><span>${fmtMoney(b.starting_capital)}</span></div>
        <div class="row"><span>Now</span><span>${fmtMoney(b.capital)}</span></div>
        <div class="row"><span>Updated</span><span>${fmtTime(b.updated_at_ms)}</span></div>
      </div>
    </div>`;
  }).join("");

  el.querySelectorAll(".bot-box").forEach(box => {
    box.addEventListener("click", () => {
      const bot = box.dataset.bot;
      selectedBot = (selectedBot === bot) ? null : bot;
      refresh();
    });
  });
}

function renderOpen(trades) {
  const el = document.getElementById("open-trades");
  if (!trades.length) { el.innerHTML = '<div class="empty">No open positions right now.</div>'; return; }
  el.innerHTML = trades.map(t => {
    const hasLive = t.unrealized_pnl_dollars !== null && t.unrealized_pnl_dollars !== undefined;
    const pnlClass = hasLive ? (t.unrealized_pnl_dollars >= 0 ? "pos" : "neg") : "";
    return `<div class="card open">
    <div class="card-top">
      <span class="card-bot">${t.strategy_id}</span>
      <span class="card-pnl ${pnlClass}">${hasLive ? fmtSignedMoney(t.unrealized_pnl_dollars) : ''}</span>
    </div>
    <div class="card-rows">
      <div class="row"><span>Status</span><span class="badge open">open — unrealized</span></div>
      <div class="row"><span>Symbol</span><span>${t.symbol}</span></div>
      <div class="row"><span>Entry time</span><span>${fmtTime(t.entry_ts_ms)}</span></div>
      <div class="row"><span>Entry price</span><span>${fmtMoney(t.entry_price)}</span></div>
      <div class="row"><span>Current price</span><span>${fmtMoney(t.current_price)}</span></div>
      <div class="row"><span>Stop / Target</span><span>${fmtMoney(t.stop_loss)} / ${fmtMoney(t.take_profit)}</span></div>
      <div class="row"><span>Shares</span><span>${Number(t.shares).toFixed(6)}</span></div>
    </div>
  </div>`;
  }).join("");
}

function renderClosed(trades) {
  const el = document.getElementById("closed-trades");
  const noteEl = document.getElementById("closed-more");
  if (!trades.length) {
    el.innerHTML = '<div class="empty">No closed trades yet — this bot hasn\'t taken (or finished) a trade since it started.</div>';
    noteEl.textContent = "";
    return;
  }
  const shown = trades.slice(0, CLOSED_TRADES_SHOWN);
  el.innerHTML = shown.map(t => {
    const win = t.return_pct > 0;
    return `<div class="card ${win ? 'win' : 'loss'}">
      <div class="card-top">
        <span class="card-bot">${t.strategy_id}</span>
        <span class="card-pnl ${win ? 'pos' : 'neg'}">${fmtSignedMoney(t.realized_pnl_dollars)}</span>
      </div>
      <div class="card-rows">
        <div class="row"><span>Return</span><span>${fmtSignedPct(t.return_pct)}</span></div>
        <div class="row"><span>Exit reason</span><span class="badge ${t.exit_reason}">${(t.exit_reason || "").replace("_"," ")}</span></div>
        <div class="row"><span>Entry</span><span>${fmtMoney(t.entry_price)} @ ${fmtTime(t.entry_ts_ms)}</span></div>
        <div class="row"><span>Exit</span><span>${fmtMoney(t.exit_price)} @ ${fmtTime(t.exit_ts_ms)}</span></div>
        <div class="row"><span>Duration</span><span>${durMin(t.entry_ts_ms, t.exit_ts_ms)}</span></div>
        <div class="row"><span>Fees</span><span>${fmtMoney(t.fees_paid)}</span></div>
      </div>
    </div>`;
  }).join("");
  noteEl.textContent = trades.length > CLOSED_TRADES_SHOWN
    ? `Showing the ${CLOSED_TRADES_SHOWN} most recent of ${trades.length} closed trades.`
    : "";
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
