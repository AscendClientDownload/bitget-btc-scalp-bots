<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>botfarm — paper trading dashboard</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #0f1115; color: #e6e6e6; margin: 0; padding: 24px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .subtitle { color: #9aa0a6; font-size: 13px; margin-bottom: 20px; }
  .summary { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
  .stat { background: #1a1d24; border: 1px solid #2a2e37; border-radius: 8px; padding: 12px 16px; min-width: 120px; }
  .stat .label { font-size: 11px; color: #9aa0a6; text-transform: uppercase; letter-spacing: 0.04em; }
  .stat .value { font-size: 20px; font-weight: 600; margin-top: 4px; }
  .value.pos { color: #4ade80; }
  .value.neg { color: #f87171; }
  section { margin-bottom: 28px; }
  h2 { font-size: 14px; font-weight: 600; margin: 0 0 10px; color: #cfd3da; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: #14161b; border: 1px solid #2a2e37; border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #22252c; white-space: nowrap; }
  th { background: #1a1d24; color: #9aa0a6; font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
  tr:last-child td { border-bottom: none; }
  .empty { color: #6b7078; padding: 16px; font-size: 13px; }
  .badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge.open { background: #1e3a5f; color: #7cc4ff; }
  .badge.stop_loss { background: #4a1e1e; color: #f87171; }
  .badge.take_profit { background: #1e4a2a; color: #4ade80; }
  .badge.time_stop { background: #3a3520; color: #eab308; }
  .badge.signal { background: #2a2035; color: #c084fc; }
  .updated { color: #6b7078; font-size: 11px; margin-top: 8px; }
</style>
</head>
<body>
<h1>botfarm — paper trading dashboard</h1>
<div class="subtitle">Local only · simulated fills · no real orders placed</div>

<div class="summary" id="summary"></div>

<section>
  <h2>Open positions</h2>
  <div id="open-trades"></div>
</section>

<section>
  <h2>Closed trades (most recent 500)</h2>
  <div id="closed-trades"></div>
</section>

<div class="updated" id="updated"></div>

<script>
function fmtPct(v) { return (v === null || v === undefined) ? "—" : (v * 100).toFixed(3) + "%"; }
function fmtPct2(v) { return (v === null || v === undefined) ? "—" : v.toFixed(2) + "%"; }
function fmtPrice(v) { return (v === null || v === undefined) ? "—" : "$" + Number(v).toLocaleString(undefined, {maximumFractionDigits: 2}); }
function fmtTime(ms) { return ms ? new Date(ms).toLocaleString() : "—"; }
function durMin(a, b) { return a && b ? ((b - a) / 60000).toFixed(1) + "m" : "—"; }

async function refresh() {
  const [summary, openTrades, closedTrades] = await Promise.all([
    fetch("/api/summary").then(r => r.json()),
    fetch("/api/trades/open").then(r => r.json()),
    fetch("/api/trades/closed").then(r => r.json()),
  ]);
  renderSummary(summary);
  renderOpen(openTrades);
  renderClosed(closedTrades);
  document.getElementById("updated").textContent = "Last updated " + new Date().toLocaleTimeString();
}

function renderSummary(s) {
  const pnlClass = s.total_pnl_pct > 0 ? "pos" : (s.total_pnl_pct < 0 ? "neg" : "");
  const stats = [
    ["Total P&L", s.total_pnl_pct.toFixed(2) + "%", pnlClass],
    ["Win rate", s.win_rate_pct.toFixed(1) + "%", ""],
    ["Profit factor", isFinite(s.profit_factor) ? s.profit_factor.toFixed(2) : "∞", ""],
    ["Closed trades", s.num_closed_trades, ""],
    ["Open positions", s.open_positions, ""],
    ["Avg duration", s.avg_duration_min.toFixed(1) + "m", ""],
  ];
  document.getElementById("summary").innerHTML = stats.map(([label, value, cls]) =>
    `<div class="stat"><div class="label">${label}</div><div class="value ${cls}">${value}</div></div>`
  ).join("");
}

function renderOpen(trades) {
  const el = document.getElementById("open-trades");
  if (!trades.length) { el.innerHTML = '<div class="empty">No open positions.</div>'; return; }
  el.innerHTML = `<table><thead><tr>
    <th>Bot</th><th>Symbol</th><th>Entry time</th><th>Entry price</th>
    <th>Stop</th><th>Target</th><th>Shares</th>
  </tr></thead><tbody>${trades.map(t => `<tr>
    <td>${t.strategy_id}</td><td>${t.symbol}</td><td>${fmtTime(t.entry_ts_ms)}</td>
    <td>${fmtPrice(t.entry_price)}</td><td>${fmtPrice(t.stop_loss)}</td>
    <td>${fmtPrice(t.take_profit)}</td><td>${Number(t.shares).toFixed(6)}</td>
  </tr>`).join("")}</tbody></table>`;
}

function renderClosed(trades) {
  const el = document.getElementById("closed-trades");
  if (!trades.length) { el.innerHTML = '<div class="empty">No closed trades yet.</div>'; return; }
  el.innerHTML = `<table><thead><tr>
    <th>Bot</th><th>Symbol</th><th>Entry time</th><th>Exit time</th><th>Duration</th>
    <th>Entry</th><th>Exit</th><th>Reason</th><th>P&L</th><th>Fees</th>
  </tr></thead><tbody>${trades.map(t => `<tr>
    <td>${t.strategy_id}</td><td>${t.symbol}</td><td>${fmtTime(t.entry_ts_ms)}</td>
    <td>${fmtTime(t.exit_ts_ms)}</td><td>${durMin(t.entry_ts_ms, t.exit_ts_ms)}</td>
    <td>${fmtPrice(t.entry_price)}</td><td>${fmtPrice(t.exit_price)}</td>
    <td><span class="badge ${t.exit_reason}">${(t.exit_reason || "").replace("_"," ")}</span></td>
    <td class="${t.return_pct > 0 ? 'pos' : 'neg'}" style="color:${t.return_pct > 0 ? '#4ade80' : '#f87171'}">${fmtPct(t.return_pct)}</td>
    <td>${fmtPrice(t.fees_paid)}</td>
  </tr>`).join("")}</tbody></table>`;
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
